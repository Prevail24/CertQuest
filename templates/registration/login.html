{% extends "base.html" %}

{% block title %}CertQuest | Login{% endblock %}

{% block content %}
<section class="hero-card">
    <p class="eyebrow">Access Terminal</p>

    <h1>Login to CertQuest</h1>

    <p class="subtitle">
        Continue your mission and build your certification skills.
    </p>

    <form method="post" class="auth-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="primary-button">
            Login
        </button>
    </form>
</section>
{% endblock %}
